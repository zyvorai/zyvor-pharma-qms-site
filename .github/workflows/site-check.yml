name: Site check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leak guard
        run: bash scripts/leak-guard.sh
      - name: Site check
        run: bash scripts/site-check.sh
