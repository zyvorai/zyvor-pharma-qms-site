<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" width="1120" height="500" role="img" aria-labelledby="t d"><title id="t">Pharma QMS architecture</title><desc id="d">Console to API to Postgres, plus desktop apps and deploy paths.</desc><rect width="1120" height="500" fill="#000000"/><text x="560" y="56" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.6">How it fits together</text><text x="560" y="90" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">One API, one database, console or native launcher. You host it.</text><rect x="80" y="140" width="240" height="120" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="104" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Console</text><text x="104" y="220" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">React SPA · same-origin</text><rect x="400" y="140" width="280" height="120" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="424" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">API</text><text x="424" y="220" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Go · chi · append-only audit</text><rect x="760" y="140" width="280" height="120" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="784" y="188" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Postgres</text><text x="784" y="220" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Migrations · plant data</text><rect x="200" y="340" width="280" height="110" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="224" y="388" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Desktop apps</text><text x="224" y="420" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">macOS · Windows · CLI</text><rect x="560" y="340" width="320" height="110" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="584" y="388" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Deploy</text><text x="584" y="420" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Compose · FluxVM · k3s · WSL</text><path d="M320 200 H400" stroke="#2997ff" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M680 200 H760" stroke="#2997ff" stroke-width="3" fill="none"/><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#2997ff"/></marker></defs></svg>
