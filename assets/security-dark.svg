<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 460" width="1120" height="460" role="img" aria-labelledby="t d"><title id="t">Pharma QMS security posture</title><desc id="d">Four cards: self-hosted, roles, audit, honest limits.</desc><rect width="1120" height="460" fill="#000000"/><text x="560" y="52" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f5f5f7" text-anchor="middle" letter-spacing="-0.6">Security posture, plainly</text><text x="560" y="86" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#a1a1a6" text-anchor="middle" letter-spacing="0.0">What we built — and what we have not claimed.</text><rect x="60" y="130" width="460" height="130" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="88" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Self-hosted</text><text x="88" y="208" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Your Postgres. Your network. Nothing</text><text x="88" y="230" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">leaves the plant by default.</text><rect x="560" y="130" width="460" height="130" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="588" y="172" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Role actors</text><text x="588" y="208" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">mfg / lab / qa / viewer / admin for pilot</text><text x="588" y="230" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">walkthroughs.</text><rect x="60" y="290" width="460" height="130" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="88" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Append-only audit</text><text x="88" y="368" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Application audit log on every write path</text><text x="88" y="390" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">— not a tamper-proof claim.</text><rect x="560" y="290" width="460" height="130" rx="20" fill="#1d1d1f" stroke="#3a3a3c" stroke-width="1.0"/><text x="588" y="332" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="0.0">Honest limits</text><text x="588" y="368" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">Not Part 11. No live CDSCO / FDA / EMVS</text><text x="588" y="390" font-family="-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#a1a1a6" text-anchor="start" letter-spacing="0.0">gateways. No pen-test yet.</text></svg>
